services:
  vault:
    build:
      context: .
      dockerfile: benzhi.Dockerfile
    environment:
      - TZ=Asia/Shanghai
      - CHUNKVAULT_DIR=/data
      - CHUNKVAULT_ADDR=:8080
    ports:
      - "18081:8080"
    volumes:
      - vault-data:/data
    working_dir: /app
    command:
      - sh
      - -c
      - go build -o /tmp/chunkvault ./cmd/chunkvault && /tmp/chunkvault -addr :8080 -data /data -web /app/web

volumes:
  vault-data:
